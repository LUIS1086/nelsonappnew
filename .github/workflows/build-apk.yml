name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:   # Permite ejecutarlo manualmente desde la web

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Build Capacitor project
        run: npx cap add android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      # --- GENERAR KEYSTORE (firma de producción) ---
      - name: Generate keystore
        run: |
          keytool -genkey -v \
            -keystore android/app/release.keystore \
            -alias nelsonapp \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Todo Repuestos Nelson, OU=Taller, O=NelsonApp, L=Neiva, ST=Huila, C=CO"

      # --- COMPILAR APK RELEASE CON FIRMA ---
      - name: Build release APK
        run: |
          cd android
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=app/release.keystore \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=nelsonapp \
            -Pandroid.injected.signing.key.password=android

      # --- SUBIR APK COMO ARTEFACTO PARA DESCARGAR ---
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nelsonapp-release
          path: android/app/build/outputs/apk/release/app-release.apk
