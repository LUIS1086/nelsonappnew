name: Build APK Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. 1.0.1)'
        required: false
        default: '1.0.0'

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Sync Capacitor to Android
        run: npx cap sync android

      - name: Generate Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/nelsonapp-release.keystore
            cat > android/keystore.properties << EOF
          storeFile=nelsonapp-release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
            echo "✅ Keystore configurado desde secrets"
          else
            echo "⚠️  Sin secrets: generando keystore de prueba"
            keytool -genkeypair -noprompt \
              -keystore android/nelsonapp-release.keystore \
              -alias nelsonapp \
              -keyalg RSA -keysize 2048 \
              -validity 10000 \
              -storepass testpassword \
              -keypass testpassword \
              -dname "CN=NelsonApp, OU=Dev, O=NelsonApp, L=CO, S=CO, C=CO"
            cat > android/keystore.properties << EOF
          storeFile=nelsonapp-release.keystore
          storePassword=testpassword
          keyAlias=nelsonapp
          keyPassword=testpassword
          EOF
          fi

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace

      - name: Rename APK
        run: |
          VERSION=${{ github.event.inputs.version_name || '1.0.0' }}
          cp android/app/build/outputs/apk/release/app-release.apk \
             nelson-app-pro-v${VERSION}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nelson-app-pro-release
          path: nelson-app-pro-*.apk
          retention-days: 30

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: nelson-app-pro-*.apk
          generate_release_notes: true
