name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 🆕 CREAR CARPETA www Y COPIAR LOS ARCHIVOS WEB
      - name: Prepare web directory
        run: |
          mkdir -p www
          # Copia todo EXCEPTO las carpetas que no deben ir a la app (node_modules, .git, .github, android, www)
          shopt -s extglob
          cp -r !(www|.git|.github|node_modules|android|package.json|package-lock.json|capacitor.config.json) www/ || true
          # Asegurar que index.html esté presente
          if [ ! -f www/index.html ]; then echo "ERROR: No se encontró index.html en la raíz"; exit 1; fi
          echo "Contenido de www:"
          ls -la www

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Build Capacitor project
        run: npx cap add android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Add biometric permission
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i '/<manifest/a \
          <uses-permission android:name="android.permission.USE_BIOMETRIC" />' $MANIFEST

      - name: Enable WebAuthn in MainActivity
        run: |
          MAIN_ACTIVITY="android/app/src/main/java/com/todorepuestos/nelson/MainActivity.java"
          sed -i '1i import android.os.Bundle;' $MAIN_ACTIVITY
          sed -i '1i import android.webkit.WebSettings;' $MAIN_ACTIVITY
          sed -i '1i import android.webkit.WebView;' $MAIN_ACTIVITY
          sed -i '/public class MainActivity extends BridgeActivity {/a \
          @Override\
          public void onCreate(Bundle savedInstanceState) {\
              super.onCreate(savedInstanceState);\
              WebView webView = getBridge().getWebView();\
              WebSettings settings = webView.getSettings();\
              settings.setWebAuthenticationSupport(WebSettings.WEB_AUTHENTICATION_SUPPORT_FOR_APP);\
          }' $MAIN_ACTIVITY

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Generate keystore
        run: |
          keytool -genkey -v \
            -keystore android/app/release.keystore \
            -alias nelsonapp \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Todo Repuestos Nelson, OU=Taller, O=NelsonApp, L=Neiva, ST=Huila, C=CO"

      - name: Build release APK
        run: |
          cd android
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=app/release.keystore \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=nelsonapp \
            -Pandroid.injected.signing.key.password=android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nelsonapp-release
          path: android/app/build/outputs/apk/release/app-release.apk
