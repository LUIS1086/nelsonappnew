<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NelsonApp \u2014 Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Mono:wght@400;500&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:        #07080f;
  --bg2:       #0d0f1c;
  --card:      #111320;
  --card2:     #161929;
  --border:    rgba(255,255,255,0.055);
  --border2:   rgba(255,255,255,0.1);
  --accent:    #f97316;
  --accent2:   #fb923c;
  --emerald:   #10b981;
  --rose:      #f43f5e;
  --blue:      #38bdf8;
  --violet:    #a78bfa;
  --text:      #e2e8f0;
  --muted:     #475569;
  --muted2:    #64748b;
  --font-disp: 'Syne', sans-serif;
  --font-body: 'Outfit', sans-serif;
  --font-mono: 'DM Mono', monospace;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { font-size: 15px; }

body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  display: none; /* shown after JS check */
}

/* Background grid + glow */
body::before {
  content: '';
  position: fixed; inset: 0; z-index: 0;
  background-image:
    linear-gradient(rgba(255,255,255,0.018) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.018) 1px, transparent 1px);
  background-size: 52px 52px;
  pointer-events: none;
}
body::after {
  content: '';
  position: fixed; inset: 0; z-index: 0;
  background:
    radial-gradient(ellipse 700px 500px at 10% 15%, rgba(249,115,22,0.07) 0%, transparent 65%),
    radial-gradient(ellipse 600px 400px at 90% 80%, rgba(56,189,248,0.05) 0%, transparent 65%),
    radial-gradient(ellipse 500px 400px at 55% 50%, rgba(167,139,250,0.04) 0%, transparent 65%);
  pointer-events: none;
}

/* \u2500\u2500 LAYOUT \u2500\u2500 */
.shell {
  position: relative; z-index: 1;
  display: grid;
  grid-template-columns: 220px 1fr;
  grid-template-rows: auto 1fr;
  min-height: 100vh;
}

/* \u2500\u2500 SIDEBAR \u2500\u2500 */
.sidebar {
  grid-row: 1 / 3;
  background: rgba(13,15,28,0.92);
  border-right: 1px solid var(--border);
  backdrop-filter: blur(20px);
  display: flex;
  flex-direction: column;
  padding: 0;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow: hidden;
}

.sidebar-brand {
  padding: 28px 24px 20px;
  border-bottom: 1px solid var(--border);
}
.brand-row {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 14px;
}
.brand-icon {
  width: 42px; height: 42px; border-radius: 14px;
  background: linear-gradient(135deg, var(--accent), #ea580c);
  display: flex; align-items: center; justify-content: center;
  font-size: 1.3rem;
  box-shadow: 0 4px 16px rgba(249,115,22,0.4);
  flex-shrink: 0;
}
.brand-text-short {
  font-family: var(--font-disp);
  font-size: 9px; font-weight: 800;
  color: var(--accent); letter-spacing: 3px;
  text-transform: uppercase;
}
.brand-text-name {
  font-family: var(--font-disp);
  font-size: 17px; font-weight: 800;
  color: white; letter-spacing: -0.3px;
  line-height: 1;
}

.sidebar-cash {
  background: rgba(16,185,129,0.08);
  border: 1px solid rgba(16,185,129,0.2);
  border-radius: 14px;
  padding: 12px 14px;
  display: flex; align-items: center; justify-content: space-between;
}
.cash-label { font-size: 9px; font-weight: 700; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; }
.cash-value {
  font-family: var(--font-mono);
  font-size: 20px; font-weight: 500;
  color: var(--emerald);
  margin-top: 2px;
}

.sidebar-nav { flex: 1; padding: 16px 12px; overflow-y: auto; }
.nav-section-label {
  font-size: 9px; font-weight: 700; color: var(--muted);
  letter-spacing: 3px; text-transform: uppercase;
  padding: 0 12px 10px;
  margin-top: 12px;
}
.nav-item {
  display: flex; align-items: center; gap: 12px;
  padding: 11px 14px; border-radius: 12px;
  cursor: pointer; transition: all 0.2s ease;
  color: var(--muted2); font-size: 13px; font-weight: 600;
  border: 1px solid transparent;
  margin-bottom: 2px;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.nav-item:hover { background: rgba(255,255,255,0.04); color: var(--text); }
.nav-item.active {
  background: rgba(249,115,22,0.12);
  color: var(--accent);
  border-color: rgba(249,115,22,0.25);
}
.nav-icon { font-size: 1.1rem; width: 22px; text-align: center; flex-shrink: 0; }

.sidebar-footer {
  padding: 16px 12px;
  border-top: 1px solid var(--border);
}
.sidebar-footer button {
  width: 100%; padding: 10px;
  border-radius: 10px; border: 1px solid var(--border2);
  background: rgba(255,255,255,0.03);
  color: var(--muted2); font-size: 12px; font-weight: 700;
  cursor: pointer; transition: all 0.2s;
  font-family: var(--font-body);
  margin-bottom: 6px;
}
.sidebar-footer button:hover { background: rgba(249,115,22,0.12); color: var(--accent); border-color: rgba(249,115,22,0.3); }
.sidebar-footer button:last-child { margin-bottom: 0; }

/* \u2500\u2500 TOPBAR \u2500\u2500 */
.topbar {
  grid-column: 2;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 32px;
  height: 66px;
  background: rgba(7,8,15,0.8);
  border-bottom: 1px solid var(--border);
  backdrop-filter: blur(20px);
  position: sticky; top: 0; z-index: 50;
}
.topbar-left { display: flex; flex-direction: column; }
.topbar-section {
  font-size: 9px; font-weight: 700; color: var(--accent);
  letter-spacing: 3px; text-transform: uppercase;
}
.topbar-title {
  font-family: var(--font-disp);
  font-size: 18px; font-weight: 800;
  color: white; letter-spacing: -0.3px; line-height: 1;
}
.topbar-right { display: flex; gap: 10px; align-items: center; }
.topbar-btn {
  padding: 8px 18px; border-radius: 10px;
  font-size: 11px; font-weight: 700; letter-spacing: 0.5px;
  cursor: pointer; transition: all 0.2s; border: 1px solid;
  font-family: var(--font-body);
}
.topbar-btn.green {
  background: rgba(16,185,129,0.12); border-color: rgba(16,185,129,0.3); color: var(--emerald);
}
.topbar-btn.green:hover { background: rgba(16,185,129,0.25); }
.topbar-btn.blue {
  background: rgba(56,189,248,0.1); border-color: rgba(56,189,248,0.3); color: var(--blue);
}
.topbar-btn.blue:hover { background: rgba(56,189,248,0.22); }
.topbar-icon-btn {
  width: 38px; height: 38px; border-radius: 10px;
  background: rgba(255,255,255,0.05); border: 1px solid var(--border2);
  display: flex; align-items: center; justify-content: center;
  font-size: 1rem; cursor: pointer; transition: all 0.2s;
}
.topbar-icon-btn:hover { background: rgba(249,115,22,0.15); border-color: rgba(249,115,22,0.35); }

/* \u2500\u2500 MAIN CONTENT \u2500\u2500 */
.main {
  grid-column: 2;
  padding: 28px 32px 40px;
  overflow-y: auto;
}

/* \u2500\u2500 KPI CARDS ROW \u2500\u2500 */
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  margin-bottom: 24px;
}

.kpi-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 22px 22px 18px;
  position: relative;
  overflow: hidden;
  transition: transform 0.2s, box-shadow 0.2s;
  animation: fadeUp 0.5s ease both;
}
.kpi-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 32px rgba(0,0,0,0.35);
}
.kpi-card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0;
  height: 2px;
  background: var(--kpi-color, var(--accent));
  border-radius: 20px 20px 0 0;
}
.kpi-card::after {
  content: attr(data-icon);
  position: absolute; right: 16px; top: 16px;
  font-size: 2.2rem; opacity: 0.12;
}
.kpi-label {
  font-size: 9px; font-weight: 800;
  color: var(--muted); letter-spacing: 3px; text-transform: uppercase;
  margin-bottom: 10px;
}
.kpi-value {
  font-family: var(--font-mono);
  font-size: 28px; font-weight: 500;
  color: white; line-height: 1;
  margin-bottom: 10px;
}
.kpi-sub {
  font-size: 11px; color: var(--muted2);
  display: flex; align-items: center; gap: 6px;
}
.kpi-badge {
  font-size: 10px; font-weight: 700; padding: 2px 8px;
  border-radius: 99px;
  background: rgba(16,185,129,0.15); color: var(--emerald);
}
.kpi-badge.warn { background: rgba(251,146,60,0.15); color: #fb923c; }
.kpi-badge.danger { background: rgba(244,63,94,0.15); color: var(--rose); }

/* \u2500\u2500 META BAR \u2500\u2500 */
.meta-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 22px 28px;
  margin-bottom: 24px;
  animation: fadeUp 0.5s 0.1s ease both;
}
.meta-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 14px;
}
.meta-title {
  font-family: var(--font-disp);
  font-size: 13px; font-weight: 800; color: white; letter-spacing: 0.5px;
}
.meta-pct {
  font-family: var(--font-mono);
  font-size: 24px; font-weight: 500;
  color: var(--emerald);
}
.meta-track {
  height: 10px; background: rgba(255,255,255,0.06);
  border-radius: 99px; overflow: hidden;
  position: relative;
}
.meta-fill {
  height: 100%; border-radius: 99px;
  background: linear-gradient(to right, #10b981, #34d399);
  transition: width 1.2s cubic-bezier(0.23, 1, 0.32, 1);
  position: relative;
}
.meta-fill::after {
  content: '';
  position: absolute; right: 0; top: 50%;
  transform: translateY(-50%);
  width: 14px; height: 14px; border-radius: 50%;
  background: #34d399;
  box-shadow: 0 0 10px rgba(52,211,153,0.7);
}
.meta-amounts {
  display: flex; justify-content: space-between;
  margin-top: 10px;
  font-size: 11px; color: var(--muted2);
}
.meta-amounts span { font-family: var(--font-mono); }
.meta-amounts .done { color: var(--emerald); }

/* \u2500\u2500 MIDDLE GRID \u2500\u2500 */
.mid-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-bottom: 24px;
}

/* \u2500\u2500 ORDERS PANEL \u2500\u2500 */
.panel {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  overflow: hidden;
  animation: fadeUp 0.5s 0.15s ease both;
}
.panel-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 22px;
  border-bottom: 1px solid var(--border);
}
.panel-title {
  font-family: var(--font-disp);
  font-size: 13px; font-weight: 800; color: white;
}
.panel-action {
  font-size: 11px; font-weight: 700; color: var(--accent);
  cursor: pointer; opacity: 0.8; transition: opacity 0.2s;
}
.panel-action:hover { opacity: 1; }
.panel-body { padding: 0 22px 16px; }

.order-row {
  display: flex; align-items: center;
  padding: 13px 0;
  border-bottom: 1px solid var(--border);
  gap: 14px;
  transition: background 0.15s;
}
.order-row:last-child { border-bottom: none; }
.order-row:hover { background: rgba(255,255,255,0.02); margin: 0 -22px; padding-left: 22px; padding-right: 22px; }

.order-num-badge {
  font-family: var(--font-mono);
  font-size: 10px; font-weight: 500;
  color: var(--accent); background: rgba(249,115,22,0.1);
  border: 1px solid rgba(249,115,22,0.2);
  padding: 3px 8px; border-radius: 6px;
  flex-shrink: 0;
}
.order-info { flex: 1; min-width: 0; }
.order-client {
  font-weight: 700; font-size: 13px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.order-device { font-size: 11px; color: var(--muted2); margin-top: 1px; }
.order-val {
  font-family: var(--font-mono);
  font-size: 13px; font-weight: 500;
  color: var(--emerald); flex-shrink: 0;
}
.status-dot {
  width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
}
.dot-recibido  { background: var(--blue); box-shadow: 0 0 6px var(--blue); }
.dot-revision  { background: #fb923c;    box-shadow: 0 0 6px #fb923c; }
.dot-reparado  { background: var(--violet); box-shadow: 0 0 6px var(--violet); }
.dot-entregado { background: var(--emerald); box-shadow: 0 0 6px var(--emerald); }

/* \u2500\u2500 STOCK PANEL \u2500\u2500 */
.stock-row {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
}
.stock-row:last-child { border-bottom: none; }
.stock-icon {
  width: 36px; height: 36px; border-radius: 10px;
  background: rgba(255,255,255,0.05);
  display: flex; align-items: center; justify-content: center;
  font-size: 1.1rem; flex-shrink: 0;
}
.stock-name {
  flex: 1; font-weight: 600; font-size: 13px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.stock-price {
  font-family: var(--font-mono);
  font-size: 12px; color: var(--emerald); flex-shrink: 0;
}
.stock-qty {
  font-family: var(--font-mono);
  font-size: 12px; color: var(--muted2);
  text-align: right; flex-shrink: 0; width: 40px;
}
.stock-bar-wrap { width: 70px; flex-shrink: 0; }
.stock-bar-track { height: 4
