<!--
═══════════════════════════════════════════════════════════════════════
NELSONAPP · ETIQUETAS REQUERIDAS POR PWABUILDER (en el <head>)
───────────────────────────────────────────────────────────────────────
Estas líneas DEBEN estar en el <head> de tu index.html.
Si ya tienes algunas, no las dupliques. Solo agrega las que falten.
═══════════════════════════════════════════════════════════════════════
-->

<!-- Manifest -->
<link rel="manifest" href="manifest.json">

<!-- Theme color (color del status bar Android) -->
<meta name="theme-color" content="#f97316">

<!-- Description (PWABuilder lo pide) -->
<meta name="description" content="Sistema de gestión para taller de reparación de electrodomésticos y venta de repuestos. Registra órdenes, controla inventario, gestiona caja y respalda en Google Drive.">

<!-- Apple touch icon (iPhone home screen) -->
<link rel="apple-touch-icon" href="icons/icon-192x192.png">
<link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152x152.png">
<link rel="apple-touch-icon" sizes="192x192" href="icons/icon-192x192.png">

<!-- Favicon -->
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192x192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512x512.png">

<!-- Apple PWA support -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NelsonApp">

<!-- Mobile viewport (probablemente ya lo tienes) -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
